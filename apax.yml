# General information
name: "@simatic-ax/ae-counter-tiax"
version: 1.0.0
author: Siemens AG
type: lib
# Description for your application example or app
description: Example tiax-library for demonstration purposes.
# URL to the repository
repository:
  type: git
  url: https://github.com/simatic-ax/ae-counter-tiax
# Targets to be compiled with 'apax build'
targets:
  - "1500"
  - "llvm"

# Registry information, to other npm-registries where Apax packages are located
registries:
  "@simatic-ax": "https://npm.pkg.github.com/"
# Install settings
installStrategy: strict
apaxVersion: 3.4.2
# Dependencies
devDependencies:
  "@ax/sdk": 2411.1.0
  "@ax/ax2tia": 10.0.8

# Project variables
variables:
  APAX_BUILD_ARGS:
    - --debug # Enable debug information for value debugging
  BIN_FOLDER: "./bin/1500" # choose your target RT, here : any S7-1500 PLC
  # An arbitrary directory that can be chosen freely
  PATH_NAME: "./bin/handover-folder"
  # You can change the predefined output path where the TIA Portal library will be generated
  TIA_GLOBAL_LIB_PATH: "./bin/TIAPortalLibrary"
  # !!! IMPORTANT !!! Set the path to your latest local TIA Portal installation, this can be any starting at V18
  TIA_INSTALL_PATH: "C:\\Program Files\\Siemens\\Automation\\Portal V20"

# Apax scripts
scripts:
  # Transfer a AX Library to handover library documents for a TIA Libray
  export-tia-handover-documents: ax2tia -i ./bin/1500/*.lib -o "$PATH_NAME"
  # Convert library handover documents into a global library for the TIA Portal
  import-handover-documents-to-tia: '"$TIA_INSTALL_PATH\\bin\\Siemens.Simatic.Lang.Library.Importer.exe" -i "$PATH_NAME" -o "$TIA_GLOBAL_LIB_PATH" -u'
  create-tialib:
    - apax build
    - apax export-tia-handover-documents
    - apax import-handover-documents-to-tia

# Files, which will be shipped with the library
files:
  - ./bin/1500/*.lib
  - ./bin/llvm/*.lib
  - ./bin/TIAPortalLibrary
  - README.md
  - LICENSE.md
